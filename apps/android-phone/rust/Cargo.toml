[package]
name = "opentivi-android-phone"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "opentivi_android_phone"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
opentivi-core = { path = "../../../crates/opentivi-core" }
uniffi = { version = "0.28", features = ["build", "cli", "bindgen", "cargo-metadata"] }
thiserror = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

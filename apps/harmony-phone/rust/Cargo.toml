[package]
name = "opentivi-harmony-phone"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "opentivi_harmony"

[dependencies]
opentivi-core = { path = "../../../crates/opentivi-core" }
napi = { version = "2", features = ["napi9"] }
napi-derive = "2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"

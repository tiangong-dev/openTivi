[package]
name = "opentivi-ios"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "opentivi_ios"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
opentivi-core = { path = "../../../crates/opentivi-core" }
uniffi = { version = "0.28", features = ["build", "cli", "bindgen", "cargo-metadata"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"
